name: Reseed Elastic demo data

on:
  schedule:
    - cron: "47 6 * * *" # 00:47 facility time (UTC-6), so the incident is always "last night"; off the hour, when GitHub drops fewer scheduled runs
  workflow_dispatch:
    inputs:
      incident_date:
        description: "Incident night as YYYY-MM-DD (empty: last night)"
        required: false

concurrency:
  group: reseed-elastic
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reseed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ES_URL: ${{ secrets.ES_URL }}
      KIBANA_URL: ${{ secrets.KIBANA_URL }}
      ELASTIC_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
      INCIDENT_DATE: ${{ inputs.incident_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Delete demo cases and watch rules
        run: python3 elastic/cleanup_demo.py
      - name: Remove seed data, rules and alerts
        run: python3 elastic/seed_insider_threat_demo.py --reset
      - name: Seed and wait for the alerts
        run: python3 elastic/seed_insider_threat_demo.py ${INCIDENT_DATE:+--incident-date "$INCIDENT_DATE"} --wait-alerts 15
